<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>Diamond Odds — Scouting</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Teko:wght@500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<header>
  <div class="brand">⚾ DIAMOND<span class="dot">·</span>ODDS</div>
  <div class="tagline">Scouting reports</div>
  <div class="nav-links">
    <a href="index.html" class="admin-link">App</a>
    <a href="admin.html" class="admin-link">Admin</a>
  </div>
</header>

<main class="admin-main">
  <div class="card">
    <p class="card-label">Find a team</p>
    <div class="admin-filter-row">
      <input type="text" class="select-input" id="teamSearchInput" placeholder="Team name..." style="flex:1;">
    </div>
    <div class="admin-event-list" id="teamSearchResults" style="margin-top:12px;"></div>
  </div>

  <div class="card" id="teamReportCard" style="display:none;">
    <p class="card-label">Team roster</p>
    <div id="teamReportContent"></div>
  </div>

  <div class="card" id="playerCard" style="display:none;">
    <p class="card-label">Player</p>
    <div id="playerContent"></div>
  </div>
</main>

<script src="scouting.js"></script>
</body>
</html>
